spring.application.name=ispl

# MySQL configuration for real local/dev deployment
spring.datasource.url=jdbc:mysql://localhost:3306/ispl?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ispl_user
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

razorpay.key-id=your_razorpay_key_id
razorpay.key-secret=your_razorpay_key_secret
razorpay.currency=INR
razorpay.gst-rate=0.18

# Security / session tuning
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
