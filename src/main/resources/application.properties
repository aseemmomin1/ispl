spring.application.name=ispl

# Default local database uses H2 to allow the app to boot in local/test environments without MySQL.
# For MySQL, set DB_URL, DB_USERNAME, DB_PASSWORD, and DB_DRIVER to your database settings.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ispl;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

razorpay.key-id=${RAZORPAY_KEY_ID:dummy}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummy}
razorpay.currency=INR
razorpay.gst-rate=0.18
