spring.application.name=ispl

# Primary datasource: MySQL. Override via environment variables when deploying.
# Example environment variables:
#   DB_URL=jdbc:mysql://localhost:3306/ispldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_USERNAME=root
#   DB_PASSWORD=your_db_password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ispldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# Optionally set DB_PASSWORD in environment; if not set the app will attempt to connect without a password.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Schema/data initialization (schema.sql and data.sql are provided)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Let Hibernate auto-detect the dialect to avoid classloading issues
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

razorpay.key-id=${RAZORPAY_KEY_ID:dummy}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummy}
razorpay.currency=INR
razorpay.gst-rate=0.18
