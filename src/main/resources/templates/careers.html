<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Careers | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-16">
    <div class="text-center">
        <p class="text-sm uppercase tracking-[0.2em] text-cyan-700">Careers</p>
        <h1 class="mt-3 text-4xl font-black">Build the future of repair with us.</h1>
    </div>
    <div class="mt-12 grid gap-6">
        <article th:each="career : ${careers}" class="bg-white rounded-2xl p-8 shadow-lg">
            <div class="flex flex-col md:flex-row justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold" th:text="${career.title}">Senior Hardware Technician</h2>
                    <p class="mt-2 text-slate-500" th:text="|${career.department} • ${career.location} • ${career.employmentType}|">Repair Operations • Bengaluru • Full-time</p>
                </div>
                <span class="inline-flex rounded-full bg-cyan-100 text-cyan-800 px-3 py-1 text-sm font-semibold">Open</span>
            </div>
            <p class="mt-6 text-slate-600 leading-7" th:text="${career.description}">We are looking for...</p>
            <div class="mt-6">
                <h3 class="font-bold">Key requirements</h3>
                <p class="mt-2 text-slate-600 leading-7" th:text="${career.requirements}">Strong troubleshooting skills...</p>
            </div>
        </article>
    </div>
</main>
</body>
</html>
