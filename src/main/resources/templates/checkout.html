<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<nav class="bg-slate-900 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a th:href="@{/}" class="text-2xl font-black">ISPL</a>
        <a th:href="@{/}" class="text-sm text-cyan-300 font-semibold">Back to services</a>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-12">
    <div class="bg-white rounded-3xl shadow-lg border border-slate-200 p-8 md:p-10">
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-cyan-700">Secure checkout</p>
        <h1 class="mt-4 text-4xl font-black">Confirm your repair request</h1>

        <div class="mt-8 grid gap-6 md:grid-cols-2">
            <div class="rounded-2xl bg-slate-50 p-5 border border-slate-200">
                <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Device</p>
                <h2 class="mt-3 text-2xl font-black" th:text="${device.name}">Laptop</h2>
                <p class="mt-3 text-slate-600" th:text="${device.shortDescription}">Performance-first laptop repairs.</p>
            </div>
            <div class="rounded-2xl bg-slate-50 p-5 border border-slate-200">
                <p class="text-sm uppercase tracking-[0.2em] text-slate-500">Selected service</p>
                <h2 class="mt-3 text-2xl font-black" th:text="${service.name}">Battery Swap</h2>
                <p class="mt-3 text-slate-600" th:text="${service.description}">Battery replacement and diagnostic testing.</p>
            </div>
        </div>

        <div class="mt-8 rounded-2xl border border-cyan-200 bg-cyan-50 p-5">
            <div class="flex items-center justify-between">
                <span class="text-slate-700 font-semibold">Estimated total</span>
                <span class="text-3xl font-black text-slate-900" th:text="|₹${service.price}|">₹2499</span>
            </div>
        </div>

        <button id="payButton" type="button" class="mt-8 w-full rounded-xl bg-cyan-500 px-5 py-4 text-lg font-black text-slate-900 shadow-md hover:bg-cyan-400">Create order & pay</button>
        <p id="status" class="mt-4 text-sm text-slate-600"></p>
    </div>
</main>

<script>
    document.getElementById('payButton').addEventListener('click', async () => {
        const button = document.getElementById('payButton');
        const status = document.getElementById('status');
        const deviceId = [[${device.id}]];
        const serviceId = [[${service.id}]];

        button.disabled = true;
        status.textContent = 'Creating your secure order...';

        try {
            const response = await fetch('/api/v1/orders/create?deviceId=' + deviceId + '&serviceId=' + serviceId, {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            });

            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.message || 'Unable to create the order.');
            }

            status.textContent = 'Order created successfully. The configured payment flow is ready for the next step.';
            button.textContent = 'Order created';
        } catch (error) {
            status.textContent = error.message || 'Could not create the order.';
            button.disabled = false;
        }
    });
</script>
</body>
</html>
