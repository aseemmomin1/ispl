<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white">
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white text-slate-900 rounded-2xl shadow-2xl w-full max-w-md p-8">
        <p class="text-sm uppercase tracking-[0.2em] text-cyan-700">Welcome back</p>
        <h1 class="mt-3 text-3xl font-black">Login to ISPL</h1>
        <p class="mt-2 text-slate-500">Sign in to continue browsing, manage your account, or complete a repair payment.</p>

        <div th:if="${param.error != null}" class="mt-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            Invalid username or password.
        </div>

        <form th:action="@{/login}" method="post" class="mt-8 space-y-5">
            <input type="hidden" name="redirect" th:value="${param.redirect != null ? param.redirect[0] : '/'}">
            <div>
                <label class="block text-sm font-medium mb-2">Username or email</label>
                <input type="text" name="username" class="w-full border rounded-lg p-3" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" class="w-full border rounded-lg p-3" required>
            </div>
            <button type="submit" class="w-full bg-cyan-500 text-slate-900 font-bold py-3 rounded-lg">Login</button>
        </form>

        <div class="mt-6 text-sm text-slate-500">
            Need an account? Contact support to create one.
        </div>
        <div class="mt-4">
            <a th:href="@{/}" class="text-cyan-700 font-semibold">Return to the website</a>
        </div>
    </div>
</div>
</body>
</html>
