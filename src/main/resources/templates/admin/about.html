<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage About Content | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="min-h-screen flex">
    <aside class="w-72 bg-slate-900 text-white p-6">
        <div class="text-2xl font-black">ISPL Admin</div>
        <nav class="mt-10 space-y-3">
            <a th:href="@{/admin}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Dashboard</a>
            <a th:href="@{/admin/devices}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Devices</a>
            <a th:href="@{/admin/services}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Services</a>
            <a th:href="@{/admin/careers}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Careers</a>
            <a th:href="@{/admin/about}" class="block bg-slate-700 rounded-lg px-4 py-3 font-semibold">About</a>
        </nav>
    </aside>
    <main class="flex-1 p-8">
        <h1 class="text-3xl font-black">About content</h1>
        <form th:action="@{/admin/about/save}" method="post" class="mt-8 bg-white rounded-2xl p-6 shadow-sm space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium mb-2">Section key</label><input type="text" name="sectionKey" class="w-full border rounded-lg p-3" required></div>
                <div><label class="block text-sm font-medium mb-2">Title</label><input type="text" name="title" class="w-full border rounded-lg p-3" required></div>
            </div>
            <div><label class="block text-sm font-medium mb-2">Body</label><textarea name="body" rows="5" class="w-full border rounded-lg p-3" required></textarea></div>
            <div class="flex items-center gap-3"><input type="checkbox" name="active" checked><span>Active</span></div>
            <button type="submit" class="bg-cyan-500 text-slate-900 font-bold px-5 py-3 rounded-lg">Save content</button>
        </form>
        <div class="mt-10 bg-white rounded-2xl shadow-sm p-6">
            <h2 class="text-2xl font-bold">Current sections</h2>
            <div class="mt-6 space-y-4">
                <div th:each="item : ${aboutItems}" class="border-b pb-4">
                    <h3 class="font-bold" th:text="${item.title}">Title</h3>
                    <p class="mt-2 text-slate-600" th:text="${item.body}">Body</p>
                    <form th:action="@{/admin/about/{id}/delete(id=${item.id})}" method="post" class="mt-3">
                        <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
