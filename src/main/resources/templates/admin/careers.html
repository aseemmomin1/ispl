<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Careers | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="min-h-screen flex">
    <aside class="w-72 bg-slate-900 text-white p-6">
        <div class="text-2xl font-black">ISPL Admin</div>
        <nav class="mt-10 space-y-3">
            <a th:href="@{/admin}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Dashboard</a>
            <a th:href="@{/admin/devices}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Devices</a>
            <a th:href="@{/admin/services}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">Services</a>
            <a th:href="@{/admin/careers}" class="block bg-slate-700 rounded-lg px-4 py-3 font-semibold">Careers</a>
            <a th:href="@{/admin/about}" class="block hover:bg-slate-800 rounded-lg px-4 py-3">About</a>
        </nav>
    </aside>
    <main class="flex-1 p-8">
        <h1 class="text-3xl font-black">Careers</h1>
        <form th:action="@{/admin/careers/save}" method="post" class="mt-8 bg-white rounded-2xl p-6 shadow-sm space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-medium mb-2">Title</label><input type="text" name="title" class="w-full border rounded-lg p-3" required></div>
                <div><label class="block text-sm font-medium mb-2">Department</label><input type="text" name="department" class="w-full border rounded-lg p-3" required></div>
                <div><label class="block text-sm font-medium mb-2">Location</label><input type="text" name="location" class="w-full border rounded-lg p-3" required></div>
                <div><label class="block text-sm font-medium mb-2">Employment type</label><input type="text" name="employmentType" class="w-full border rounded-lg p-3" required></div>
            </div>
            <div><label class="block text-sm font-medium mb-2">Description</label><textarea name="description" rows="4" class="w-full border rounded-lg p-3" required></textarea></div>
            <div><label class="block text-sm font-medium mb-2">Requirements</label><textarea name="requirements" rows="4" class="w-full border rounded-lg p-3" required></textarea></div>
            <div class="flex items-center gap-3"><input type="checkbox" name="active" checked><span>Active</span></div>
            <button type="submit" class="bg-cyan-500 text-slate-900 font-bold px-5 py-3 rounded-lg">Save career</button>
        </form>
        <div class="mt-10 bg-white rounded-2xl shadow-sm p-6">
            <h2 class="text-2xl font-bold">Existing openings</h2>
            <div class="mt-6 space-y-4">
                <div th:each="career : ${careers}" class="flex items-center justify-between border-b pb-4">
                    <div>
                        <h3 class="font-bold" th:text="${career.title}">Title</h3>
                        <p class="text-sm text-slate-500" th:text="|${career.department} • ${career.location}|">Department</p>
                    </div>
                    <form th:action="@{/admin/careers/{id}/delete(id=${career.id})}" method="post">
                        <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded-lg">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
