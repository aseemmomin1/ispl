<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="bg-slate-900 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <a th:href="@{/}" class="text-2xl font-bold">ISPL</a>
        <div class="flex items-center gap-6 text-sm">
            <a th:href="@{/about}" class="hover:text-cyan-300">About</a>
            <a th:href="@{/device}" class="hover:text-cyan-300">Repair</a>
            <a th:href="@{/careers}" class="hover:text-cyan-300">Careers</a>
            <a th:href="@{/contact}" class="hover:text-cyan-300">Contact</a>

            <a th:if="${!loggedIn}" th:href="@{/login}" class="bg-cyan-500 px-3 py-2 rounded-md text-slate-900 font-semibold">Login</a>
            <a th:if="${isAdmin}" th:href="@{/admin}" class="bg-slate-700 px-3 py-2 rounded-md font-semibold">Admin</a>

            <form th:if="${loggedIn}" th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="bg-white/10 px-3 py-2 rounded-md font-semibold">Logout</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
