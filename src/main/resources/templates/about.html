<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>About | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-5xl mx-auto px-4 py-16">
    <div class="text-center">
        <p class="text-sm uppercase tracking-[0.25em] text-cyan-700">About</p>
        <h1 class="mt-3 text-4xl font-black">A repair company built on trust.</h1>
    </div>
    <div class="mt-12 space-y-8">
        <article th:each="item : ${aboutItems}" class="bg-white shadow-xl rounded-2xl p-8">
            <h2 class="text-2xl font-bold" th:text="${item.title}">Our Story</h2>
            <p class="mt-4 text-slate-600 leading-7" th:text="${item.body}">We help...</p>
        </article>
    </div>
</main>
</body>
</html>
