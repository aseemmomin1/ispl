<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-5xl mx-auto px-4 py-16">
    <div class="grid md:grid-cols-2 gap-8">
        <div>
            <p class="text-sm uppercase tracking-[0.2em] text-cyan-700">Contact</p>
            <h1 class="mt-3 text-4xl font-black">Talk to our repair team.</h1>
            <p class="mt-5 text-slate-600 leading-7">Have a device issue, want operational support, or need a custom service plan for your team? Reach out and we will respond quickly.</p>
            <div class="mt-8 space-y-3 text-slate-700">
                <p><strong>Email:</strong> support@ispl.example</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Hours:</strong> Mon-Sat, 9:00 AM to 8:00 PM</p>
            </div>
        </div>
        <form class="bg-white rounded-2xl p-8 shadow-lg space-y-4">
            <input type="text" placeholder="Full name" class="w-full border rounded-lg p-3">
            <input type="email" placeholder="Email address" class="w-full border rounded-lg p-3">
            <textarea rows="5" placeholder="Message" class="w-full border rounded-lg p-3"></textarea>
            <button type="button" class="bg-cyan-500 text-slate-900 font-bold px-5 py-3 rounded-lg">Send message</button>
        </form>
    </div>
</main>
</body>
</html>
