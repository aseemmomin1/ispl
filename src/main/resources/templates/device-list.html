<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Repair Services | ISPL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-7xl mx-auto px-4 py-16">
    <div class="text-center">
        <p class="text-sm uppercase tracking-[0.2em] text-cyan-700">Repair</p>
        <h1 class="mt-3 text-4xl font-black">Trusted repair services for every device</h1>
    </div>
    <div class="mt-12 grid md:grid-cols-2 xl:grid-cols-4 gap-6">
        <div th:each="device : ${devices}" class="bg-white rounded-2xl p-6 shadow-lg">
            <p class="text-xs uppercase tracking-[0.2em] text-cyan-700" th:text="${device.category.name}">Mobile</p>
            <h2 class="mt-4 text-2xl font-bold" th:text="${device.name}">Galaxy S Series</h2>
            <p class="mt-3 text-slate-600" th:text="${device.shortDescription}">Premium smartphone diagnostics and display solutions.</p>
            <div class="mt-6 flex justify-between items-center">
                <span class="font-bold" th:text="|₹${device.priceFrom}|">₹2499</span>
                <a th:href="@{/device/{slug}(slug=${device.slug})}" class="text-cyan-700 font-semibold">Book now</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
